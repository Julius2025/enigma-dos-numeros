<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7df">
<title>Missão Matemática — 2º ano</title>
<style>
:root{--ink:#26324a;--muted:#5e6980;--purple:#7050d5;--dark:#5334b0;--line:#e8e2f1;--green:#23774d;--red:#a83240}
*{box-sizing:border-box}body{margin:0;padding:20px 12px 28px;min-height:100vh;background:radial-gradient(circle at 8% 8%,#ffe89c,transparent 23rem),radial-gradient(circle at 95% 90%,#e0d6ff,transparent 24rem),#fff8e5;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}button{font:inherit}.page{max-width:720px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;color:var(--dark);font-weight:900}.scores{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 12px;background:white;border:1px solid var(--line);border-radius:30px}.card{overflow:hidden;background:white;border:1px solid var(--line);border-radius:23px;box-shadow:0 14px 40px #48377820}.hero{text-align:center;padding:24px 18px 16px}.hero h1{margin:0;color:var(--dark);font-size:clamp(1.7rem,5vw,2.25rem)}.hero p{margin:8px 0 0;color:var(--muted);font-size:1.05rem}.progress{padding:0 26px 20px}.meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;color:var(--muted);font-weight:800}.track{height:12px;border-radius:20px;background:#eeeaf7;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ffc940,#8b6cf0);transition:width .3s}.game{padding:23px 26px;border-top:1px solid var(--line)}.level{display:inline-block;padding:7px 12px;border-radius:20px;background:#f0ebff;color:var(--dark);font-weight:900}.question{margin:15px 0 8px;font-size:clamp(1.25rem,4vw,1.6rem);line-height:1.35}.instruction{margin:0;color:var(--muted)}.visual{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;min-height:96px;margin:18px 0;padding:14px;border:2px dashed #ddd5f4;border-radius:17px;background:#faf8ff;text-align:center;font-size:clamp(2rem,8vw,3rem)}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.answer{min-height:62px;border:2px solid #ddd5f4;border-radius:15px;background:white;color:var(--ink);font-size:1.5rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--line)}.answer:hover:not(:disabled),.answer:focus-visible{border-color:var(--purple);outline:3px solid #d7ccff}.answer:disabled{cursor:default}.answer.correct{color:#155b3a;border-color:#81c9a2;background:#e4f7ec}.answer.wrong{color:#8d2631;border-color:#e7a0a6;background:#fff0f0}.feedback{min-height:52px;margin-top:16px;font-weight:800;line-height:1.45}.success{color:var(--green)}.oops{color:var(--red)}.next{display:none;width:100%;min-height:52px;margin-top:5px;border:0;border-radius:14px;color:white;background:var(--purple);font-size:1.05rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 var(--dark)}.next:hover{background:var(--dark)}.awards{padding:18px 26px 23px;border-top:1px solid var(--line);background:#fdfcff}.awards h2{margin:0 0 11px;font-size:1.05rem}.medals{display:flex;flex-wrap:wrap;gap:8px}.medal{padding:8px 10px;border:1px solid var(--line);border-radius:25px;background:white;color:#667087;font-size:.84rem;font-weight:800;opacity:.55;filter:grayscale(1)}.medal.on{color:#523b00;border-color:#e9bd3c;background:#fff4c9;opacity:1;filter:none}.end{text-align:center;padding:25px 8px}.end .big{font-size:4rem}.end h2{color:var(--dark);font-size:2rem}.end p{color:var(--muted);font-size:1.1rem;line-height:1.5}.credit{text-align:center;padding:15px;color:var(--muted);font-size:.85rem}@media(max-width:520px){body{padding:12px 9px}.top{align-items:flex-start;flex-direction:column}.progress,.game,.awards{padding-left:17px;padding-right:17px}.options{grid-template-columns:1fr}.answer{min-height:56px}}
</style>
</head>
<body><main class="page">
<div class="top"><div>⭐ Missão Matemática</div><div class="scores"><span class="pill">🌟 Pontos: <b id="score">0</b></span><span class="pill">🔥 Acertos seguidos: <b id="streak">0</b></span></div></div>
<section class="card" aria-label="Jogo de matemática">
<header class="hero"><h1>Uma aventura de números!</h1><p>Para o 2º ano • Leia, conte e escolha. Sem pressa 😊</p></header>
<div class="progress"><div class="meta"><span id="level-name">Nível 1 de 3</span><span id="count">Pergunta 1 de 12</span></div><div class="track" role="progressbar" aria-label="Progresso do jogo" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0"><div class="fill" id="fill"></div></div></div>
<section class="game" id="game"><span class="level" id="topic"></span><h2 class="question" id="question"></h2><p class="instruction">Escolha uma resposta:</p><div class="visual" id="visual" aria-hidden="true"></div><div class="options" id="options"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="next" id="next" type="button">Próxima pergunta ➜</button></section>
<section class="awards" aria-label="Conquistas"><h2>🏅 Medalhas</h2><div class="medals" id="medals"></div></section>
</section><footer class="credit">Trabalho escolar • Criado por Julia Kellen</footer></main>
<script>
const questions=[
{l:1,t:"🌱 Nível 1: Números até 10",q:"Há 3 passarinhos no galho. Chegam mais 2. Quantos há agora?",v:"🐦 🐦 🐦 ➕ 🐦 🐦",o:["4","5","6"],a:1,h:"Conte 3 e mais 2: 4, 5. São 5 passarinhos!"},
{l:1,t:"🌱 Nível 1: Números até 10",q:"Havia 8 bananas. O macaco comeu 3. Quantas sobraram?",v:"🍌 🍌 🍌 🍌 🍌 🍌 🍌 🍌",o:["5","4","6"],a:0,h:"Volte 3 números a partir de 8: 7, 6, 5. Sobraram 5."},
{l:1,t:"🌱 Nível 1: Números até 10",q:"Qual número vem depois do 6?",v:"4   5   6   ❓   8",o:["7","5","9"],a:0,h:"Conte em ordem: 4, 5, 6, 7, 8. Falta o 7."},
{l:1,t:"🌱 Nível 1: Números até 10",q:"Quatro estrelas mais quatro estrelas. Quantas são?",v:"⭐ ⭐ ⭐ ⭐ ➕ ⭐ ⭐ ⭐ ⭐",o:["7","8","9"],a:1,h:"Conte as quatro primeiras e mais quatro. Ao todo são 8!"},
{l:2,t:"🌿 Nível 2: Contas até 20",q:"Lia tem 9 figurinhas e ganha mais 6. Quantas tem?",v:"🎟️ 9 ➕ 6",o:["14","15","16"],a:1,h:"Conte mais seis depois do 9: 10, 11, 12, 13, 14, 15."},
{l:2,t:"🌿 Nível 2: Contas até 20",q:"Havia 16 bolinhas. Caíram 7. Quantas ficaram?",v:"🔵 16 ➖ 7",o:["8","9","10"],a:1,h:"Volte sete números a partir de 16. Você chega ao 9."},
{l:2,t:"🌿 Nível 2: Contas até 20",q:"Qual número está faltando?",v:"11   12   ❓   14",o:["10","13","15"],a:1,h:"A contagem aumenta de 1 em 1: 11, 12, 13, 14."},
{l:2,t:"🌿 Nível 2: Contas até 20",q:"Some 8, 5 e mais 2. Qual é o resultado?",v:"8 ➕ 5 ➕ 2",o:["14","15","16"],a:1,h:"Primeiro, 8 + 5 = 13. Depois, 13 + 2 = 15."},
{l:3,t:"🌳 Nível 3: Desafio até 100",q:"Duas dezenas mais três dezenas. Quantas unidades são?",v:"🔟 🔟 ➕ 🔟 🔟 🔟",o:["40","50","60"],a:1,h:"Cada dezena vale 10. Cinco dezenas são 50."},
{l:3,t:"🌳 Nível 3: Desafio até 100",q:"Pedro tinha 47 carrinhos. Deu 20 ao amigo. Quantos ficaram?",v:"🚗 47 ➖ 20",o:["27","37","29"],a:0,h:"Tirando 2 dezenas de 47, ficam 2 dezenas e 7 unidades: 27."},
{l:3,t:"🌳 Nível 3: Desafio até 100",q:"Qual número vem depois de 32 quando contamos de 1 em 1?",v:"30   31   32   ❓   34",o:["33","35","30"],a:0,h:"Depois do 32 vem o 33."},
{l:3,t:"🌳 Nível 3: Desafio até 100",q:"Bia tinha 24 figurinhas e ganhou mais 13. Quantas tem agora?",v:"🎴 24 ➕ 13",o:["36","37","38"],a:1,h:"20 + 10 = 30. 4 + 3 = 7. Total: 37."}
];
const medals=[{id:"first",icon:"🌟",name:"Primeira estrela"},{id:"streak",icon:"🔥",name:"Trinca de acertos"},{id:"level",icon:"🌱",name:"Nível 1 completo"},{id:"champ",icon:"🏆",name:"Campeã dos números"}];
let i=0,score=0,streak=0,right=0,done=false,locked=false;
function drawMedals(){const box=document.getElementById("medals");box.innerHTML="";medals.forEach(m=>{const b=document.createElement("span");b.className="medal"+(m.on?" on":"");b.textContent=m.icon+" "+m.name;box.appendChild(b)})}
function unlock(id){const m=medals.find(x=>x.id===id);if(m&&!m.on){m.on=true;drawMedals()}}
function render(){if(i>=questions.length){finish();return}locked=false;const q=questions[i];document.getElementById("level-name").textContent="Nível "+q.l+" de 3";document.getElementById("count").textContent="Pergunta "+(i+1)+" de 12";document.querySelector(".track").setAttribute("aria-valuenow",String(i));document.getElementById("fill").style.width=(i*100/questions.length)+"%";document.getElementById("topic").textContent=q.t;document.getElementById("question").textContent=q.q;document.getElementById("visual").textContent=q.v;const f=document.getElementById("feedback");f.textContent="";f.className="feedback";const next=document.getElementById("next");next.style.display="none";next.textContent=i===questions.length-1?"Ver minhas medalhas 🏆":"Próxima pergunta ➜";const opts=document.getElementById("options");opts.innerHTML="";q.o.forEach((x,j)=>{const b=document.createElement("button");b.type="button";b.className="answer";b.textContent=x;b.setAttribute("aria-label","Resposta "+x);b.onclick=()=>answer(j);opts.appendChild(b)});document.getElementById("score").textContent=score;document.getElementById("streak").textContent=streak}
function answer(j){if(locked||done)return;locked=true;const q=questions[i];[...document.querySelectorAll(".answer")].forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("correct");else if(k===j)b.classList.add("wrong")});const f=document.getElementById("feedback");if(j===q.a){score+=10;streak++;right++;unlock("first");if(streak>=3)unlock("streak");f.className="feedback success";f.textContent="Muito bem! 🎉 "+q.h}else{streak=0;f.className="feedback oops";f.textContent="Boa tentativa! A resposta é "+q.o[q.a]+". "+q.h}if(i===3)unlock("level");document.getElementById("score").textContent=score;document.getElementById("streak").textContent=streak;document.querySelector(".track").setAttribute("aria-valuenow",String(i+1));document.getElementById("fill").style.width=((i+1)*100/questions.length)+"%";document.getElementById("next").style.display="block"}
function next(){if(!done){i++;render()}}
function finish(){done=true;unlock("champ");document.getElementById("level-name").textContent="Aventura concluída!";document.getElementById("count").textContent="12 perguntas respondidas";document.querySelector(".track").setAttribute("aria-valuenow","12");document.getElementById("fill").style.width="100%";document.getElementById("game").innerHTML='<div class="end"><div class="big">🏆</div><h2>Você conseguiu!</h2><p>Você ganhou '+score+' pontos e acertou '+right+' de 12 perguntas. Parabéns por aprender e tentar!</p><button class="next" id="again" style="display:block" type="button">Jogar de novo 🔄</button></div>';document.getElementById("again").onclick=restart}
function restart(){i=score=streak=right=0;done=false;medals.forEach(m=>m.on=false);drawMedals();document.getElementById("game").innerHTML='<span class="level" id="topic"></span><h2 class="question" id="question"></h2><p class="instruction">Escolha uma resposta:</p><div class="visual" id="visual" aria-hidden="true"></div><div class="options" id="options"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="next" id="next" type="button">Próxima pergunta ➜</button>';document.getElementById("next").onclick=next;render()}
document.getElementById("next").onclick=next;drawMedals();render();
</script></body></html>
